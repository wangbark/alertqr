<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<meta name="allc-build" content="ALLC-NOTIFY-ONCE-OTP-CENTER-20260901-1615">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AllC Login</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');
:root{font-family:"Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 14px 40px;background:#f4f7fb;color:#172033}
button,a,input{font-family:inherit}
.wrap{width:min(100%,480px);margin:0 auto}
.head{text-align:center;padding:2px 0 18px}
.head h1{margin:0;font-size:27px;font-weight:700}
.head p{margin:5px 0 0;color:#8a95a5;font-size:13px}
.overview{background:#fff;border:1px solid #e5eaf1;border-radius:20px;padding:7px 16px;box-shadow:0 12px 34px rgba(32,48,78,.06)}
.system{display:flex;align-items:center;gap:12px;padding:14px 0}
.system+.system{border-top:1px solid #edf1f5}
.sysicon{width:40px;height:40px;border-radius:12px;background:#f2f5f9;display:grid;place-items:center;font-weight:700;color:#5d6a7d;flex:0 0 auto}
.sysbody{min-width:0;flex:1}
.sysname{font-size:15px;font-weight:700;margin-bottom:2px}
.sysmsg{font-size:13px;color:#7b8697;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:600;background:#eef2f6;color:#657184}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:#98a3b2}
.pill.ok{background:#e9f8ef;color:#187442}.pill.ok:before{background:#27a667}
.pill.wait{background:#fff4e6;color:#9a5b14}.pill.wait:before{background:#e39a35}
.pill.work{background:#edf3ff;color:#3760a4}.pill.work:before{background:#5788e4}
.pill.err{background:#fdeeee;color:#a13d3d}.pill.err:before{background:#d45c5c}
.action{display:none;margin-top:14px;background:#fff;border:1px solid #e5eaf1;border-radius:22px;padding:21px;box-shadow:0 14px 38px rgba(32,48,78,.08)}
.action.show{display:block}
.actionTitle{font-size:20px;font-weight:700;margin:0 0 5px;text-align:center}
.actionSub{color:#7b8697;font-size:14px;line-height:1.6;text-align:center}
.qrbox{display:none;margin:19px auto 5px;width:270px;max-width:84%;padding:10px;background:#fff;border:1px solid #e6ebf1;border-radius:18px}
.qrbox img{display:block;width:100%;height:auto;border-radius:8px}
.count{display:none;text-align:center;font-size:43px;font-weight:700;margin:14px 0 0}
.count span{font-size:15px;font-weight:500;color:#8490a1;margin-left:3px}
.openbtn{display:none;width:100%;border:0;border-radius:14px;min-height:54px;padding:14px 17px;margin-top:18px;background:#2f6fed;color:#fff;font-size:18px;font-weight:700;text-align:center;text-decoration:none}
.otpbox{display:none;margin:20px auto 0;text-align:center}
.otpref{text-align:center;color:#7b8697;font-size:13px;margin-bottom:10px}
.otpinput{
  display:block;
  width:min(292px,88%);
  height:66px;
  margin:0 auto;
  border:1.5px solid #ccd5e1;
  border-radius:15px;
  background:#fff;
  color:#172033;
  text-align:center;
  font-size:31px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:12px;
  text-indent:6px;
  padding:0 12px;
  outline:none;
  line-height:66px
}
.otpinput::placeholder{
  color:#c2cad6;
  letter-spacing:9px;
  text-indent:4px
}
.otpinput:focus{border-color:#2f6fed;box-shadow:0 0 0 4px rgba(47,111,237,.10)}
.otpbtn{
  display:block;
  width:min(292px,88%);
  border:0;
  border-radius:14px;
  min-height:52px;
  padding:13px 17px;
  margin:12px auto 0;
  background:#2f6fed;
  color:#fff;
  font-size:18px;
  font-weight:700;
  cursor:pointer
}
.otpbtn:disabled{background:#c7cfdd;cursor:default}
.otperr{
  width:min(320px,94%);
  min-height:21px;
  margin:9px auto 0;
  text-align:center;
  font-size:13px;
  color:#b54848
}
.footer{text-align:center;margin-top:13px;color:#98a1af;font-size:12px}
.connection{display:none;margin-top:14px;padding:11px 13px;border-radius:13px;background:#fff8f8;border:1px solid #f2d7da;color:#9d4848;font-size:13px;text-align:center}
@media(max-width:360px){body{padding-left:10px;padding-right:10px}.overview{padding-left:13px;padding-right:13px}.action{padding:18px}.qrbox{max-width:90%}}
</style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <h1>AllC Login</h1>
    <p>สถานะการเข้าสู่ระบบ</p>
  </header>

  <section class="overview">
    <div class="system">
      <div class="sysicon">E</div>
      <div class="sysbody">
        <div class="sysname">eClaim</div>
        <div id="eMsg" class="sysmsg">กำลังตรวจสถานะ...</div>
      </div>
      <div id="ePill" class="pill">กำลังตรวจ</div>
    </div>
    <div class="system">
      <div class="sysicon">F</div>
      <div class="sysbody">
        <div class="sysname">FDH</div>
        <div id="fMsg" class="sysmsg">กำลังตรวจสถานะ...</div>
      </div>
      <div id="fPill" class="pill">กำลังตรวจ</div>
    </div>
  </section>

  <section id="action" class="action">
    <h2 id="actionTitle" class="actionTitle"></h2>
    <div id="actionSub" class="actionSub"></div>
    <div id="qrbox" class="qrbox"><img id="qr" alt="Login QR Code"></div>
    <div id="count" class="count">-- <span>วินาที</span></div>
    <a id="open" class="openbtn" href="#">เปิดแอป</a>

    <div id="otpbox" class="otpbox">
      <div id="otpref" class="otpref"></div>
      <input id="otpinput" class="otpinput" type="tel" inputmode="numeric"
             autocomplete="one-time-code" pattern="[0-9]*" maxlength="6"
             placeholder="· · · · · ·" aria-label="OTP 6 หลัก">
      <button id="otpbtn" class="otpbtn" type="button">ส่ง OTP</button>
      <div id="otperr" class="otperr"></div>
    </div>
  </section>

  <div id="connection" class="connection">ยังเชื่อมต่อ AllC Automation ไม่ได้</div>
  <div id="updated" class="footer"></div>
</main>

<script>
(() => {
  const BUILD='ALLC-NOTIFY-ONCE-OTP-CENTER-20260901-1615';
  const ePill=document.getElementById('ePill'),eMsg=document.getElementById('eMsg');
  const fPill=document.getElementById('fPill'),fMsg=document.getElementById('fMsg');
  const action=document.getElementById('action'),actionTitle=document.getElementById('actionTitle'),actionSub=document.getElementById('actionSub');
  const qrbox=document.getElementById('qrbox'),qr=document.getElementById('qr'),count=document.getElementById('count');
  const open=document.getElementById('open'),otpbox=document.getElementById('otpbox'),otpref=document.getElementById('otpref');
  const otpinput=document.getElementById('otpinput'),otpbtn=document.getElementById('otpbtn'),otperr=document.getElementById('otperr');
  const updated=document.getElementById('updated'),connection=document.getElementById('connection');

  let baseUrl='',expiresAt=0,serverOffset=0,lastLocatorCheck=0;

  function setPill(el,kind,text){el.className='pill'+(kind?' '+kind:'');el.textContent=text}
  function normalize(v){return String(v||'').toLowerCase()}

  function hideAction(){
    action.classList.remove('show');
    qrbox.style.display='none';count.style.display='none';
    open.style.display='none';open.href='#';
    otpbox.style.display='none';otperr.textContent='';
    expiresAt=0;
  }

  function beginAction(title,sub){
    action.classList.add('show');
    actionTitle.textContent=title;
    actionSub.textContent=sub||'';
  }

  function showQr(img){
    if(img){qr.src='data:image/png;base64,'+img;qrbox.style.display='block'}
    else qrbox.style.display='none';
  }

  function renderCountdown(){
    if(!expiresAt){count.style.display='none';return}
    const left=Math.max(0,Math.ceil((expiresAt-(Date.now()+serverOffset))/1000));
    count.style.display='block';
    count.innerHTML=left+' <span>วินาที</span>';
    if(left<=0){expiresAt=0;count.style.display='none';qrbox.style.display='none';open.style.display='none'}
  }

  async function refreshLocator(force=false){
    if(!force&&Date.now()-lastLocatorCheck<4500)return;
    lastLocatorCheck=Date.now();
    const r=await fetch('./current.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('current.json HTTP '+r.status);
    const d=await r.json(),candidate=String(d.baseUrl||'').replace(/\/+$/,'');
    if(d.status!=='online'||!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/i.test(candidate))throw new Error('Tunnel not ready');
    baseUrl=candidate;
  }

  async function getState(path){
    try{
      const r=await fetch(baseUrl+path+'?t='+Date.now(),{cache:'no-store',mode:'cors'});
      if(!r.ok)throw 0;
      return await r.json();
    }catch{return null}
  }

  function renderEclaimStatus(t){
    const s=normalize(t?.sessionStatus);
    if(s==='logged-in'){setPill(ePill,'ok','พร้อม');eMsg.textContent='Session ใช้งานได้';return}
    if(t?.active&&t?.deepLink){setPill(ePill,'wait','รอ ThaiD');eMsg.textContent='ต้องยืนยันตัวตนจากมือถือ';return}
    if(s==='checking'){setPill(ePill,'work','กำลังตรวจ');eMsg.textContent='กำลังตรวจ Session';return}
    if(['logging-in','waiting-confirmation','waiting-login','login-entry'].includes(s)){setPill(ePill,'work','กำลัง Login');eMsg.textContent='กำลังเตรียม ThaiD';return}
    if(s==='error'){setPill(ePill,'err','มีปัญหา');eMsg.textContent=t?.sessionMessage||'Login ไม่สำเร็จ';return}
    setPill(ePill,'','ยังไม่ Login');eMsg.textContent='ยังไม่มีขั้นตอนที่ต้องทำบนมือถือ';
  }

  function renderFdhStatus(p){
    const s=normalize(p?.status),os=normalize(p?.otpStatus);
    const otpActive=p?.otpRequired===true&&['waiting','received','processing'].includes(os);

    if(s==='logged-in'){setPill(fPill,'ok','พร้อม');fMsg.textContent='Session/Token ใช้งานได้';return}
    if(otpActive){
      setPill(fPill,os==='waiting'?'wait':'work',os==='waiting'?'รอ OTP':'กำลังยืนยัน');
      fMsg.textContent=os==='waiting'?'ต้องกรอก OTP จากมือถือ':'รับ OTP แล้ว กำลังดำเนินการ';
      return;
    }
    if(['credential-login','account-confirm','provider-login','logging-in','waiting-qr','checking'].includes(s)){
      setPill(fPill,'work','กำลัง Login');fMsg.textContent=p?.message||'กำลังเข้าสู่ระบบ';return;
    }
    if(s==='error'||os==='error'){setPill(fPill,'err','มีปัญหา');fMsg.textContent=p?.message||p?.otpMessage||'Login ไม่สำเร็จ';return}
    setPill(fPill,'','ยังไม่ Login');fMsg.textContent='ยังไม่มีขั้นตอนที่ต้องทำบนมือถือ';
  }

  function renderThaiDAction(t){
    if(!(t?.active&&t?.deepLink))return false;
    beginAction('ยืนยัน eClaim ผ่าน ThaiD','แตะปุ่มด้านล่างเพื่อเปิด ThaiD');
    otpbox.style.display='none';
    showQr(t.imageBase64);
    expiresAt=t.expiresAt?new Date(t.expiresAt).getTime():0;
    open.textContent='เปิด ThaiD';open.href=t.deepLink;open.style.display='block';
    renderCountdown();
    return true;
  }

  function renderOtpAction(p){
    const s=normalize(p?.otpStatus);
    const active=p?.otpRequired===true&&['waiting','received','processing'].includes(s);
    if(!active)return false;

    beginAction('กรอก OTP สำหรับ FDH',p?.otpMessage||'นำ OTP 6 หลักจาก LINE OA หมอพร้อมมากรอกที่นี่');
    qrbox.style.display='none';open.style.display='none';otpbox.style.display='block';
    otpref.textContent=p?.otpRefCode?'Ref: '+p.otpRefCode:'';

    const writable=s==='waiting';
    otpinput.disabled=!writable;otpbtn.disabled=!writable;
    if(s==='received')otperr.textContent='รับ OTP แล้ว · กำลังส่งเข้า FDH';
    else if(s==='processing')otperr.textContent='กำลังยืนยัน OTP';
    else otperr.textContent='';

    expiresAt=p?.otpExpiresAt?new Date(p.otpExpiresAt).getTime():0;
    renderCountdown();
    if(writable)setTimeout(()=>{try{otpinput.focus()}catch{}},80);
    return true;
  }

  async function submitOtp(){
    const value=(otpinput.value||'').replace(/\D/g,'').slice(0,6);
    otpinput.value=value;
    if(value.length!==6){otperr.textContent='กรุณากรอก OTP ให้ครบ 6 หลัก';otpinput.focus();return}
    if(!baseUrl){otperr.textContent='ยังเชื่อมต่อ AllC Automation ไม่ได้';return}

    otpbtn.disabled=true;otperr.textContent='กำลังส่ง OTP...';
    try{
      const r=await fetch(baseUrl+'/api/provider/otp/submit',{
        method:'POST',mode:'cors',cache:'no-store',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({otp:value})
      });

      let data=null;try{data=await r.json()}catch{}
      otpinput.value='';

      if(!r.ok||!data?.ok){
        otperr.textContent=data?.message||'ส่ง OTP ไม่สำเร็จ';
        otpbtn.disabled=false;otpinput.disabled=false;otpinput.focus();return;
      }

      otperr.textContent='ส่ง OTP แล้ว · รอระบบตรวจสอบ';
    }catch{
      otpinput.value='';
      otperr.textContent='ส่ง OTP ไม่สำเร็จ · ตรวจสอบการเชื่อมต่อ';
      otpbtn.disabled=false;otpinput.disabled=false;
    }
  }

  otpinput.addEventListener('input',()=>{otpinput.value=(otpinput.value||'').replace(/\D/g,'').slice(0,6);otperr.textContent=''});
  otpinput.addEventListener('keydown',e=>{if(e.key==='Enter')submitOtp()});
  otpbtn.addEventListener('click',submitOtp);

  async function poll(){
    try{
      await refreshLocator(false);
      if(!baseUrl)throw 0;

      const [p,t]=await Promise.all([
        getState('/api/provider/public-state'),
        getState('/api/thaid/public-state')
      ]);

      if(!p&&!t)throw 0;
      connection.style.display='none';

      const serverTime=p?.serverTime||t?.serverTime;
      if(serverTime)serverOffset=new Date(serverTime).getTime()-Date.now();

      renderEclaimStatus(t);
      renderFdhStatus(p);

      // No generic "ต้อง Login" card.
      // Action card appears only when the phone has actual work.
      hideAction();
      if(!renderOtpAction(p))renderThaiDAction(t);

      const stamps=[p?.otpUpdatedAt,p?.updatedAt,t?.updatedAt]
        .filter(Boolean).map(x=>new Date(x).getTime()).filter(Number.isFinite);

      updated.textContent=stamps.length
        ? 'อัปเดตล่าสุด '+new Date(Math.max(...stamps)).toLocaleTimeString('th-TH')
        : '';

    }catch{
      baseUrl='';hideAction();
      setPill(ePill,'','ไม่ทราบ');setPill(fPill,'','ไม่ทราบ');
      eMsg.textContent='รอการเชื่อมต่อ';fMsg.textContent='รอการเชื่อมต่อ';
      connection.style.display='block';updated.textContent='';
      try{await refreshLocator(true)}catch{}
    }
  }

  poll();
  setInterval(poll,900);
  setInterval(renderCountdown,250);
})();
</script>
<div data-build="ALLC-NOTIFY-ONCE-OTP-CENTER-20260901-1615" style="display:none"></div>
</body>
</html>
