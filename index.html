<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<title>Login</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');
:root{font-family:"Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f4f7fb;color:#172033;padding:30px 16px;font-family:"Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif}
button,a{font-family:inherit}
.wrap{width:min(100%,460px);margin:0 auto}
.head{padding:0 0 18px;text-align:center}.head h1{margin:0;font-size:29px;font-weight:700}
.card{background:#fff;border:1px solid #e5eaf1;border-radius:22px;padding:22px;box-shadow:0 14px 38px rgba(32,48,78,.08)}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:999px;background:#eef2f6;color:#657184;font-size:14px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#98a3b2}
.badge.ready{background:#e9f8ef;color:#187442}.badge.ready .dot{background:#27a667}
.badge.warn{background:#fff4e6;color:#9a5b14}.badge.warn .dot{background:#e39a35}
.badge.success{background:#e8f7ef;color:#137141}.badge.success .dot{background:#20a261}
.badge.error{background:#fdeeee;color:#a13d3d}.badge.error .dot{background:#d45c5c}
.status{font-size:21px;font-weight:700;margin:18px 0 5px;line-height:1.45}
.sub{color:#7b8697;font-size:15px;line-height:1.65}
.qrbox{display:none;margin:22px auto 5px;width:270px;max-width:84%;padding:10px;background:#fff;border:1px solid #e6ebf1;border-radius:18px}
.qrbox img{display:block;width:100%;height:auto;border-radius:8px}
.count{display:none;text-align:center;font-size:48px;font-weight:700;margin:16px 0 0}
.count span{font-size:16px;font-weight:500;color:#8490a1;margin-left:4px}
.btn{display:none;width:100%;border:0;border-radius:15px;min-height:56px;padding:15px 18px;margin-top:20px;background:#2f6fed;color:#fff;font-size:20px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
.otpbox{display:none;margin-top:22px}
.otpref{text-align:center;color:#7b8697;font-size:14px;margin-bottom:10px}
.otpinput{width:100%;height:66px;border:1.5px solid #ccd5e1;border-radius:15px;background:#fff;text-align:center;font-size:31px;font-weight:700;letter-spacing:12px;padding-left:12px;outline:none;color:#172033}
.otpinput:focus{border-color:#2f6fed;box-shadow:0 0 0 4px rgba(47,111,237,.10)}
.otpbtn{display:block;width:100%;border:0;border-radius:15px;min-height:56px;padding:14px 18px;margin-top:13px;background:#2f6fed;color:#fff;font-size:19px;font-weight:700;cursor:pointer}
.otpbtn:disabled{background:#c7cfdd;cursor:default}
.otperr{min-height:22px;text-align:center;margin-top:10px;font-size:14px;color:#b54848}
.updated{text-align:center;margin-top:14px;color:#98a1af;font-size:13px}
@media(max-width:360px){.card{padding:18px}.qrbox{max-width:90%}}
</style>
</head>
<body>
<main class="wrap">
  <header class="head"><h1 id="title">Login</h1></header>
  <section class="card">
    <div id="badge" class="badge"><span class="dot"></span><span id="badgeText">กำลังเชื่อมต่อ...</span></div>
    <div id="status" class="status">กำลังรอ FDH Automation</div>
    <div id="sub" class="sub">ระบบจะอัปเดตสถานะให้อัตโนมัติ</div>
    <div id="qrbox" class="qrbox"><img id="qr" alt="Login QR Code"></div>
    <div id="count" class="count">-- <span>วินาที</span></div>
    <a id="open" class="btn" href="#">เปิดแอป</a>
    <div id="otpbox" class="otpbox">
      <div id="otpref" class="otpref"></div>
      <input id="otpinput" class="otpinput" type="tel" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="------" aria-label="OTP 6 หลัก">
      <button id="otpbtn" class="otpbtn" type="button">ส่ง OTP</button>
      <div id="otperr" class="otperr"></div>
    </div>
    <div id="updated" class="updated"></div>
  </section>
</main>
<script>
(() => {
  const title=document.getElementById('title'),badge=document.getElementById('badge'),badgeText=document.getElementById('badgeText');
  const status=document.getElementById('status'),sub=document.getElementById('sub'),qrbox=document.getElementById('qrbox'),qr=document.getElementById('qr');
  const count=document.getElementById('count'),open=document.getElementById('open'),updated=document.getElementById('updated');
  const otpbox=document.getElementById('otpbox'),otpref=document.getElementById('otpref'),otpinput=document.getElementById('otpinput'),otpbtn=document.getElementById('otpbtn'),otperr=document.getElementById('otperr');
  let baseUrl='',expiresAt=0,serverOffset=0,lastLocatorCheck=0;

  function setBadge(kind,text){badge.className='badge'+(kind?' '+kind:'');badgeText.textContent=text}
  function clearAction(){open.style.display='none';open.href='#';qrbox.style.display='none';count.style.display='none';otpbox.style.display='none';otperr.textContent='';expiresAt=0}
  function showQr(img){if(img){qr.src='data:image/png;base64,'+img;qrbox.style.display='block'}else qrbox.style.display='none'}
  function renderCountdown(){
    if(!expiresAt){count.style.display='none';return}
    const left=Math.max(0,Math.ceil((expiresAt-(Date.now()+serverOffset))/1000));
    count.style.display='block';count.innerHTML=left+' <span>วินาที</span>';
    if(left<=0){expiresAt=0;count.style.display='none';qrbox.style.display='none';open.style.display='none';setBadge('warn','QR หมดอายุ');status.textContent='กำลังรอ QR รอบใหม่';sub.textContent='ระบบจะอัปเดตให้อัตโนมัติ'}
  }
  async function refreshLocator(force=false){
    if(!force&&Date.now()-lastLocatorCheck<4500)return;
    lastLocatorCheck=Date.now();
    const r=await fetch('./current.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('current.json HTTP '+r.status);
    const d=await r.json(),candidate=String(d.baseUrl||'').replace(/\/+$/,'');
    if(d.status!=='online'||!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/i.test(candidate))throw new Error('Tunnel not ready');
    baseUrl=candidate;
  }
  async function getState(path){try{const r=await fetch(baseUrl+path+'?t='+Date.now(),{cache:'no-store',mode:'cors'});if(!r.ok)throw 0;return await r.json()}catch{return null}}

  function renderOtp(p){
    clearAction();
    title.textContent='FDH OTP';
    setBadge(p.otpStatus==='received'||p.otpStatus==='processing'?'ready':'','รอ OTP');
    status.textContent=p.otpStatus==='received'||p.otpStatus==='processing'
      ? 'รับ OTP แล้ว · กำลังส่งเข้า FDH'
      : 'กรอกรหัส OTP 6 หลัก';
    sub.textContent=p.otpMessage||'เปิด LINE OA หมอพร้อม คัดลอก OTP แล้ววางที่นี่';
    otpref.textContent=p.otpRefCode ? 'Ref: '+p.otpRefCode : '';
    otpbox.style.display='block';
    otpbtn.disabled=p.otpStatus!=='waiting';
    otpinput.disabled=p.otpStatus!=='waiting';
    if(p.otpExpiresAt){
      expiresAt=new Date(p.otpExpiresAt).getTime();
      renderCountdown();
    }
    updated.textContent=p.otpUpdatedAt?'อัปเดตล่าสุด '+new Date(p.otpUpdatedAt).toLocaleTimeString('th-TH'):'';
  }

  async function submitOtp(){
    const value=(otpinput.value||'').replace(/\D/g,'').slice(0,6);
    otpinput.value=value;

    if(value.length!==6){
      otperr.textContent='กรุณากรอก OTP ให้ครบ 6 หลัก';
      otpinput.focus();
      return;
    }

    if(!baseUrl){
      otperr.textContent='ยังเชื่อมต่อเครื่อง FDH ไม่ได้';
      return;
    }

    otpbtn.disabled=true;
    otperr.textContent='กำลังส่ง OTP...';

    try{
      const r=await fetch(baseUrl+'/api/provider/otp/submit',{
        method:'POST',
        mode:'cors',
        cache:'no-store',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({otp:value})
      });

      let data=null;
      try{data=await r.json()}catch{}

      // Erase the OTP from the page as soon as the request finishes.
      otpinput.value='';

      if(!r.ok||!data?.ok){
        otperr.textContent=data?.message||'ส่ง OTP ไม่สำเร็จ';
        otpbtn.disabled=false;
        otpinput.disabled=false;
        otpinput.focus();
        return;
      }

      otperr.textContent='ส่ง OTP แล้ว · รอระบบตรวจสอบ';
      status.textContent='กำลังกรอก OTP ใน FDH';
    }catch{
      otpinput.value='';
      otperr.textContent='ส่ง OTP ไม่สำเร็จ · ตรวจสอบการเชื่อมต่อ';
      otpbtn.disabled=false;
      otpinput.disabled=false;
    }
  }

  otpinput.addEventListener('input',()=>{
    otpinput.value=(otpinput.value||'').replace(/\D/g,'').slice(0,6);
    otperr.textContent='';
  });
  otpinput.addEventListener('keydown',e=>{
    if(e.key==='Enter') submitOtp();
  });
  otpbtn.addEventListener('click',submitOtp);

  function renderProvider(p){
    if(p.otpRequired){
      renderOtp(p);
      return true;
    }

    title.textContent='Provider ID Login';
    updated.textContent=p.updatedAt?'อัปเดตล่าสุด '+new Date(p.updatedAt).toLocaleTimeString('th-TH'):'';
    if(p.active&&p.imageBase64){
      showQr(p.imageBase64);expiresAt=p.expiresAt?new Date(p.expiresAt).getTime():0;setBadge('ready','พร้อม Login');status.textContent='Provider ID QR พร้อมแล้ว';
      if(p.payloadKind==='uri'&&p.openUri){sub.textContent='ตรวจพบ QR แบบลิงก์ · ลองเปิด MOPH ID ได้';open.textContent='เปิด MOPH ID';open.href=p.openUri;open.style.display='block'}
      else{sub.textContent='QR เป็น Token/Transaction · กรุณาสแกนด้วยแอป MOPH ID';open.style.display='none'}
      renderCountdown();return true;
    }
    clearAction();
    if(p.status==='logged-in'){setBadge('success','Login สำเร็จ');status.textContent='FDH พร้อมใช้งาน ✓';sub.textContent='Session/Token พร้อมแล้ว'}
    else if(p.status==='logging-in'||p.status==='waiting-qr'){setBadge('','กำลัง Login');status.textContent='กำลังเตรียม Provider ID';sub.textContent=p.message||'QR จะขึ้นอัตโนมัติเมื่อพร้อม'}
    else if(p.status==='expired'){setBadge('warn','QR หมดอายุ');status.textContent='กำลังรอ Provider ID QR ใหม่';sub.textContent='ระบบจะอัปเดตให้อัตโนมัติ'}
    else if(p.status==='error'){setBadge('error','Login ไม่สำเร็จ');status.textContent='FDH Login มีปัญหา';sub.textContent=p.message||'ตรวจสอบ FDH Automation ที่เครื่องหลัก'}
    else{setBadge('','รอ Login');status.textContent='กำลังรอ FDH Provider ID';sub.textContent='เริ่มงาน FDH ที่เครื่องหลัก แล้ว QR จะขึ้นที่นี่'}
    return ['logging-in','waiting-qr','login-required','error','expired'].includes(p.status);
  }

  function renderThaid(s){
    title.textContent='ThaiD Login';updated.textContent=s.updatedAt?'อัปเดตล่าสุด '+new Date(s.updatedAt).toLocaleTimeString('th-TH'):'';
    if(s.active&&s.deepLink){
      showQr(s.imageBase64);expiresAt=s.expiresAt?new Date(s.expiresAt).getTime():0;setBadge('ready','พร้อม Login');status.textContent='QR ThaiD พร้อมแล้ว';sub.textContent='กด “เปิด ThaiD” เพื่อยืนยันตัวตน';
      open.textContent='เปิด ThaiD';open.href=s.deepLink;open.style.display='block';renderCountdown();return;
    }
    clearAction();
    if(s.sessionStatus==='logged-in'){setBadge('success','Login สำเร็จ');status.textContent='eClaim พร้อมใช้งาน ✓';sub.textContent='Session ยังใช้งานได้'}
    else if(s.sessionStatus==='checking'){setBadge('','กำลังตรวจ Session');status.textContent='กำลังตรวจ eClaim Session';sub.textContent='รอสักครู่'}
    else if(s.sessionStatus==='login-required'){setBadge('warn','ต้อง Login');status.textContent='eClaim ต้อง Login ใหม่';sub.textContent='ระบบกำลังเตรียม ThaiD'}
    else if(s.sessionStatus==='logging-in'||s.sessionStatus==='waiting-confirmation'){setBadge('','กำลัง Login');status.textContent='กำลังเตรียม ThaiD Login';sub.textContent='QR จะขึ้นอัตโนมัติเมื่อพร้อม'}
    else{setBadge('','รอ Login');status.textContent='กำลังรอ eClaim';sub.textContent='ระบบจะอัปเดตให้อัตโนมัติ'}
  }

  async function poll(){
    try{
      await refreshLocator(false);if(!baseUrl)throw 0;
      const [p,t]=await Promise.all([getState('/api/provider/public-state'),getState('/api/thaid/public-state')]);
      const serverTime=p?.serverTime||t?.serverTime;if(serverTime)serverOffset=new Date(serverTime).getTime()-Date.now();
      if(p&&(p.otpRequired||p.active||['logging-in','waiting-qr','login-required','error','expired'].includes(p.status))){renderProvider(p);return}
      if(t){renderThaid(t);return}
      if(p){renderProvider(p);return}
      throw 0;
    }catch{
      baseUrl='';clearAction();title.textContent='Login';setBadge('error','ยังเชื่อมต่อไม่ได้');status.textContent='กำลังรอ FDH Automation';sub.textContent='กำลังค้นหาการเชื่อมต่อล่าสุด...';updated.textContent='';
      try{await refreshLocator(true)}catch{}
    }
  }
  poll();setInterval(poll,1000);setInterval(renderCountdown,250);
})();
</script>
</body>
</html>
